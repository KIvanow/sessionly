[package]
name = "sessionly"
version = "0.6.2"
edition = "2021"
rust-version = "1.89"
description = "Local collector and ledger for AI coding agent sessions"
license = "Apache-2.0"
homepage = "https://sessionly.dev"
repository = "https://github.com/KIvanow/sessionly"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive", "env"] }
rusqlite = { version = "0.42.0", features = ["bundled", "fallible_uint"] }
schemars = { version = "1.2.3", features = ["chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.11.1"
ureq = { version = "3.5.2", features = ["json"] }
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target."cfg(unix)".dependencies]
libc = "0.2.191"
