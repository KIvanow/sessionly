# Self-hosting: the server with the dashboard, and Postgres.
#   SESSIONLY_ADMIN_TOKEN=choose-a-long-secret docker compose up -d
# then open http://localhost:8080 and sign in with that token.
#
# For people to sign in with Google or GitHub, also set SESSIONLY_PUBLIC_URL
# (where they reach the dashboard) and the id and secret of either, here in
# the environment or in a .env file beside this one. See "Server" in
# README.md.
services:
  server:
    build: .
    ports:
      - "${SESSIONLY_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://sessionly:sessionly@db:5432/sessionly
      SESSIONLY_ADMIN_TOKEN: ${SESSIONLY_ADMIN_TOKEN:?set SESSIONLY_ADMIN_TOKEN to a long secret}
      SESSIONLY_ADMIN_EMAIL: ${SESSIONLY_ADMIN_EMAIL:-admin@localhost}
      # Optional: signing in with Google or GitHub. Empty, there are only tokens.
      SESSIONLY_PUBLIC_URL: ${SESSIONLY_PUBLIC_URL:-}
      SESSIONLY_GOOGLE_CLIENT_ID: ${SESSIONLY_GOOGLE_CLIENT_ID:-}
      SESSIONLY_GOOGLE_CLIENT_SECRET: ${SESSIONLY_GOOGLE_CLIENT_SECRET:-}
      SESSIONLY_GITHUB_CLIENT_ID: ${SESSIONLY_GITHUB_CLIENT_ID:-}
      SESSIONLY_GITHUB_CLIENT_SECRET: ${SESSIONLY_GITHUB_CLIENT_SECRET:-}
      # The dashboard counts which of its pages are opened (README, "Dashboard"); "off" stops it.
      SESSIONLY_TELEMETRY: ${SESSIONLY_TELEMETRY:-}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: sessionly
      POSTGRES_PASSWORD: sessionly
      POSTGRES_DB: sessionly
    volumes:
      - sessionly-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sessionly"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  sessionly-db:
