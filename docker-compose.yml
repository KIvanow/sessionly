# Self-hosting: the server with the dashboard, and Postgres.
#   docker compose up -d
# then open http://localhost:8080. The dashboard opens without signing in,
# as SESSIONLY_ADMIN_EMAIL: anyone who can reach the port is its admin, so
# keep it on a network you trust. Machines connect with a token made on its
# Connect page.
#
# Settings go here in the environment or in a .env file beside this one.
# See docs-site/server.md.
services:
  server:
    build: .
    ports:
      # This machine only, unless SESSIONLY_BIND says another of its
      # addresses (0.0.0.0: all of them): whoever reaches the port is its admin.
      - "${SESSIONLY_BIND:-127.0.0.1}:${SESSIONLY_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://sessionly:sessionly@db:5432/sessionly
      SESSIONLY_ADMIN_EMAIL: ${SESSIONLY_ADMIN_EMAIL:-admin@localhost}
      # The address the dashboard is opened at, if a name other than localhost
      # (a proxy's, https://sessionly.example.com): it opens only there.
      SESSIONLY_PUBLIC_URL: ${SESSIONLY_PUBLIC_URL:-}
      # Optional: an admin token that always works, for scripts and CI.
      SESSIONLY_ADMIN_TOKEN: ${SESSIONLY_ADMIN_TOKEN:-}
      # The dashboard counts which of its pages are opened (docs-site/dashboard.md); "off" stops it.
      SESSIONLY_TELEMETRY: ${SESSIONLY_TELEMETRY:-}
      DO_NOT_TRACK: ${DO_NOT_TRACK:-}
      # Optional: one repository's sessions shown in a second organisation
      # (docs-site/server-configuration.md). Empty, nothing is shown.
      SESSIONLY_DEMO_FROM: ${SESSIONLY_DEMO_FROM:-}
      SESSIONLY_DEMO_REPO: ${SESSIONLY_DEMO_REPO:-}
      SESSIONLY_DEMO_ORG: ${SESSIONLY_DEMO_ORG:-}
      SESSIONLY_DEMO_HIDE: ${SESSIONLY_DEMO_HIDE:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: sessionly
      POSTGRES_PASSWORD: sessionly
      POSTGRES_DB: sessionly
    volumes:
      - sessionly-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sessionly"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
volumes:
  sessionly-db:
