name: Release

# Pushing a tag v<version> builds the binaries and publishes them as a GitHub
# release, with their checksums. `sessionly install --repo` writes those
# checksums into the script a repository commits, so an archive is never
# replaced once it is published.
#
# Run by hand, it builds the same archives and keeps them as artifacts of the
# run, without publishing anything: a way to try the build.
#
# The same tag builds the server's container image and pushes it to
# ghcr.io/kivanow/sessionly-server.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Actions are named by the commit they were at when this was written, not by a
# tag that can be moved: this workflow publishes what people run.
jobs:
  # A tag must be the version the code says it is. Everything waits for this,
  # so that a mistyped tag publishes nothing.
  version:
    runs-on: ubuntu-latest
    outputs:
      # A tag like v0.4.0-rc.1 is tried by those who ask for it, and is not "latest".
      stable: ${{ steps.check.outputs.stable }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: check
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/sessionly/Cargo.toml | head -1)"
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "The tag is $GITHUB_REF_NAME but Cargo.toml says $version." >&2
              exit 1
            fi
          fi
          case "$GITHUB_REF_NAME" in
            *-*) echo "stable=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "stable=true" >> "$GITHUB_OUTPUT" ;;
          esac

  # Everything CI checks on a pull request, on exactly what is being
  # released. Nothing is published unless it passes.
  checks:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Statically linked: runs on any Linux, which is what a cloud
          # agent's sandbox needs.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - name: Install the musl C compiler
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: The binary runs
        # The Intel build cannot run on the Apple silicon machine that builds it.
        if: matrix.target != 'x86_64-apple-darwin'
        run: target/${{ matrix.target }}/release/sessionly --version
      - name: The Linux binary needs nothing from the system
        if: contains(matrix.target, 'musl')
        run: |
          # ldd cannot be asked: it answers differently for a static binary
          # on each architecture.
          file target/${{ matrix.target }}/release/sessionly | tee /dev/stderr |
            grep -Eq 'static(ally|-pie) linked'
      - name: Pack
        run: tar -czf sessionly-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release sessionly
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sessionly-${{ matrix.target }}
          path: sessionly-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # The server as a container image, for hosting it (infra/). A tag pushes
  # it; a run by hand only builds it.
  image:
    needs: [version, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          # with the Business and Enterprise features; without a license it behaves like the core
          target: ee
          push: ${{ github.ref_type == 'tag' }}
          # "latest" follows releases only, not a release candidate.
          tags: |
            ghcr.io/kivanow/sessionly-server:${{ github.ref_name }}
            ${{ needs.version.outputs.stable == 'true' && 'ghcr.io/kivanow/sessionly-server:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [version, build, checks]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          merge-multiple: true
      - name: Checksums
        run: |
          sha256sum sessionly-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" ${{ needs.version.outputs.stable == 'true' && ' ' || '--prerelease' }} \
            --title "Sessionly ${GITHUB_REF_NAME#v}" \
            --notes "Binaries for Linux (statically linked) and macOS, each as \`sessionly-<target>.tar.gz\`, with their SHA-256 checksums in \`SHA256SUMS\`. See the README for how to install." \
            sessionly-*.tar.gz SHA256SUMS
