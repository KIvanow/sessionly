name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  licensing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every commit is signed off (DCO)
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch has no "before": check everything reachable from HEAD.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            scripts/check-signoff.sh "$HEAD"
          else
            scripts/check-signoff.sh "$BASE..$HEAD"
          fi
      - name: Nothing outside ee/ imports from ee/
        run: node scripts/check-ee-imports.mjs
      - name: Only the allowed files see the database unscoped
        run: node scripts/check-unscoped.mjs

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # The oldest Rust the crate claims to build with (rust-version in Cargo.toml).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  # The TypeScript side: server and shared types.
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # The same tests on a real Postgres, connected as a role that is not a
      # superuser, like the one a managed database gives: row-level security
      # and the switch of role have to hold there too.
      - name: The server's tests on Postgres
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -qc "CREATE ROLE managed LOGIN PASSWORD 'managed' CREATEDB CREATEROLE"
          export TEST_DATABASE_URL=postgres://managed:managed@localhost:5432/postgres
          pnpm --filter @sessionly/server test
          pnpm --filter @sessionly/ee test
      - run: pnpm build
