# Reports each pull request of this repository to the hosted Sessionly, which
# works out how much of it coding agents wrote and how those lines fare in
# review. Hashes of the added lines are sent, never the lines. See action/README.md.
name: Sessionly
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  pull_request_review:
    types: [submitted]
  # Pull requests from before this workflow was added, or from before the
  # Action reported what it does now.
  workflow_dispatch:
    inputs:
      number:
        description: The pull request to report; "all" for the latest, or a range such as 20-60
        required: true

permissions: {}

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      # To read the pull request, and to post the figures on it as a comment.
      pull-requests: write
      # Only the report of an earlier pull request compares commits.
      contents: read
    env:
      # A step cannot ask whether a secret is set; it can ask this.
      DEMO_TOKEN: ${{ secrets.SESSIONLY_DEMO_TOKEN }}
    steps:
      - uses: KIvanow/sessionly/action@c0b1e569d8686e3b244daa68fa73ea19c16748f9 # several pull requests in one run ("all", 20-60), 18 November 2026
        with:
          url: https://app.sessionly.dev
          # A token with the ci role, which can report pull requests and nothing else.
          token: ${{ secrets.SESSIONLY_TOKEN }}
          pr-number: ${{ inputs.number }}
          backfill: ${{ github.event_name == 'workflow_dispatch' }}
      # The same report to the organisation this repository is shown in to
      # anyone (see "Showing a repository in another organisation" in the docs),
      # where there is a token for it. The comment above is the only one.
      - if: env.DEMO_TOKEN != ''
        uses: KIvanow/sessionly/action@c0b1e569d8686e3b244daa68fa73ea19c16748f9
        with:
          url: https://app.sessionly.dev
          token: ${{ secrets.SESSIONLY_DEMO_TOKEN }}
          pr-number: ${{ inputs.number }}
          backfill: ${{ github.event_name == 'workflow_dispatch' }}
          comment: false
          summary: false
