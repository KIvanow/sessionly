name: Sessionly pull request report
description: >-
  Reports a pull request to your Sessionly server, which works out how much of
  it coding agents wrote, with which models, and how those lines fare in review.
branding:
  icon: git-pull-request
  color: blue

inputs:
  url:
    description: Address of your Sessionly server, e.g. https://sessionly.example.com
    required: true
  token:
    description: A Sessionly token with the ci role. Keep it in a secret.
    required: true
  github-token:
    description: Token used to read the pull request (and to comment, if that is switched on).
    default: ${{ github.token }}
  comment:
    description: >-
      Post the figures as one comment on the pull request, kept up to date as
      the pull request changes. Needs pull-requests write permission; without
      it the run warns and the figures are on its summary page only. Set to
      "false" for no comment.
    default: "true"
  summary:
    description: Write the figures to the workflow run's summary page.
    default: "true"
  ignore:
    description: >-
      Files to leave out, separated by commas or new lines: a file name, a
      path, or a pattern with * (which also matches /).
    default: package-lock.json, pnpm-lock.yaml, yarn.lock, bun.lock, Cargo.lock, go.sum, poetry.lock, uv.lock, composer.lock, Gemfile.lock, *.min.js, *.min.css, *.snap, *.map
  other-names:
    description: >-
      Other names clones of this repository may still have as their origin,
      as owner/name separated by commas: for example the name it had before
      it was renamed or moved to another owner.
    default: ""
  backfill:
    description: >-
      For a pull request from before the Action was added: first report it as
      it was when it was opened, worked out from its commits, so that what
      review changed can still be measured. Changes nothing for a pull
      request the server already knows.
    default: "false"
  pr-number:
    description: >-
      The pull request to report. Only needed when the workflow was not
      started by a pull request. Also "all", for the repository's latest
      (see since), or two numbers such as "20-60" for those numbered from one
      to the other: at most 100 in one run, and no comment is posted on them.
    default: ""
  since:
    description: >-
      With pr-number "all": report the pull requests created on or after this
      date (2026-08-01). The last 90 days when not set.
    default: ""
  after-merge:
    description: >-
      Count merged pull requests' agent lines again on the branch they were
      merged into, 7 and 30 days after: the server says which are due, and
      their files are read as they are on that branch now. A run started by
      a schedule does this without being told, unless pr-number is set. Needs contents read
      permission. Reports no pull request and writes on none.
    default: "false"
  outcomes:
    description: >-
      On a scheduled run, or one with after-merge and no pr-number, also read
      the later commits on the branches merged pull requests went into, for
      30 days after each merge: the server then says which of them reverted,
      fixed or reworked the agents' lines. Needs the repository checked out
      with its whole history (actions/checkout with fetch-depth: 0; without a
      checkout the run only notes it, and with only the latest commits it
      warns, or fails with fail-on-error), and contents and pull-requests read
      permission; issues read for the labels of linked issues. Sent for each commit: its SHA and when it
      landed, the paths it changed among those the server asked about and
      hashes of the lines it removed and added there, the numbers of its pull
      requests and of those it reverts, the SHAs it says it reverts, and what
      it says it is (a fix, a revert) as ids; and the SHAs of the commits the
      branch was read at. No message, title, body, branch name or label is
      sent.
    default: "true"
  outcomes-since:
    description: >-
      With outcomes: also read the later commits of pull requests merged on
      or after this date (2026-08-01), more than 30 days before the server
      began to (it reads those of the 30 days before by itself).
      History is still there, so these can be counted late.
    default: ""
  fix-words:
    description: >-
      Words that make a later commit a fix, in its subject line or its pull
      request's title, separated by commas, in place of the default list
      (fix, fixes, fixed, bug, hotfix, regression, crash, typo and a few more).
    default: ""
  bug-labels:
    description: >-
      Words that make a linked issue's label a bug label, separated by
      commas, in place of the default list (bug, regression, defect, incident).
    default: ""
  ci:
    description: >-
      Read what CI made of the pull request's commits: of each head it was
      reported at (a red push), and of the commit it was merged as (the base
      branch red after it). Read when a pull request is reported, when a
      workflow named in a workflow_run trigger finishes, and on a scheduled
      run for what is still pending. Needs checks and statuses read
      permission, and actions read to tell which workflow file each check is
      from and which runs a merge commit's push started. Without the first
      two the run warns and CI is not known; without actions read it warns,
      leaves out only this job's own check run, and knows no merge commit's
      CI. The runs of the workflow files that hold Sessionly's jobs are left
      out: this run's own file, or the files sessionly-workflows names where
      that is set. Skipped jobs never count. Sent for each commit: its SHA, a state (success, failure, pending or none),
      how many checks and statuses failed, how many there were, and how many
      were cancelled. No check's name, unless ci-check-names says so. Set to
      "false" to read none.
    default: "true"
  sessionly-workflows:
    description: >-
      The workflow files that hold only Sessionly's jobs, separated by commas
      or new lines (sessionly.yml, or .github/workflows/sessionly.yml): their
      runs are left out of the CI it reads, in place of this run's own file.
      Keep Sessionly's jobs in files of their own; where one has to sit in a
      CI workflow, name the other files here (or "none"), and that file's CI
      jobs count, with only this job's own check run left out of it.
    default: ""
  ci-ignore:
    description: >-
      Checks and statuses to leave out when reading CI, by name, separated
      by commas or new lines; * stands for any text. Sessionly's own
      workflow runs are left out by file (sessionly-workflows), not here.
    default: ""
  ci-only:
    description: >-
      Count only the checks and statuses named here (as ci-ignore names
      them), for example the ones required to merge. Everything else is
      left out.
    default: ""
  ci-check-names:
    description: >-
      Also send the names of the checks and statuses that failed on a red
      commit (at most 20, each cut to 100 characters), so the dashboard can
      say which. Off by default: names can carry the names of clients,
      environments or systems.
    default: "false"
  check-run-id:
    description: >-
      The id of this job's own check run, which is left out of the CI it
      reads. Set by the workflow run itself; leave it.
    default: ${{ job.check_run_id }}
  fail-on-error:
    description: Fail the job if the report cannot be made or sent. By default a problem is only a warning.
    default: "false"

outputs:
  lines:
    description: Tracked lines the pull request adds.
    value: ${{ steps.report.outputs.lines }}
  agent-lines:
    description: How many of them a coding agent wrote.
    value: ${{ steps.report.outputs.agent-lines }}

runs:
  using: composite
  steps:
    - id: report
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/main.mjs"
      env:
        SESSIONLY_URL: ${{ inputs.url }}
        SESSIONLY_TOKEN: ${{ inputs.token }}
        SESSIONLY_GITHUB_TOKEN: ${{ inputs.github-token }}
        SESSIONLY_COMMENT: ${{ inputs.comment }}
        SESSIONLY_SUMMARY: ${{ inputs.summary }}
        SESSIONLY_IGNORE: ${{ inputs.ignore }}
        SESSIONLY_OTHER_NAMES: ${{ inputs.other-names }}
        SESSIONLY_BACKFILL: ${{ inputs.backfill }}
        SESSIONLY_PR_NUMBER: ${{ inputs.pr-number }}
        SESSIONLY_SINCE: ${{ inputs.since }}
        SESSIONLY_AFTER_MERGE: ${{ inputs.after-merge }}
        SESSIONLY_OUTCOMES: ${{ inputs.outcomes }}
        SESSIONLY_OUTCOMES_SINCE: ${{ inputs.outcomes-since }}
        SESSIONLY_FIX_WORDS: ${{ inputs.fix-words }}
        SESSIONLY_BUG_LABELS: ${{ inputs.bug-labels }}
        SESSIONLY_CI: ${{ inputs.ci }}
        SESSIONLY_WORKFLOWS: ${{ inputs.sessionly-workflows }}
        SESSIONLY_CI_IGNORE: ${{ inputs.ci-ignore }}
        SESSIONLY_CI_ONLY: ${{ inputs.ci-only }}
        SESSIONLY_CI_CHECK_NAMES: ${{ inputs.ci-check-names }}
        SESSIONLY_CHECK_RUN_ID: ${{ inputs.check-run-id }}
        SESSIONLY_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
